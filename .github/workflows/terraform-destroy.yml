name: terraform-destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '輸入 destroy-dev 以確認銷毀（此操作不可復原）'
        required: true
        default: ''

concurrency:
  group: tf-dev-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - name: 確認輸入
        if: inputs.confirm != 'destroy-dev'
        run: |
          echo "confirm 欄位必須輸入 destroy-dev，實際收到：'${{ inputs.confirm }}'"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::575005867578:role/gh-terraform-apply
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false

      - name: destroy
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform destroy -auto-approve -input=false -lock-timeout=10m
