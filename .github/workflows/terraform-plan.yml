name: terraform-plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

# 同一個 PR 連推 commit 時取消前一次，避免搶 state 鎖
concurrency:
  group: tf-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write        # ← 沒有這行拿不到 OIDC token，assume 會失敗
  contents: read
  pull-requests: write   # ← 為了把 plan 貼回 PR

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/gh-terraform-plan
          aws-region: ap-northeast-1

      - name: 確認身分（除錯用，成功後可刪）
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: .          # ← 根目錄，涵蓋 modules/（見 D-3）

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        continue-on-error: true
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform plan -no-color -input=false -lock-timeout=5m | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 把 plan 貼回 PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync(
              'terraform/environments/dev/plan.txt', 'utf8');
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n...(輸出過長已截斷，詳見 Actions log)';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform Plan (dev)\n```hcl\n' + body + '\n```'
            });

      - name: plan 失敗就讓整個 job 紅掉
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
