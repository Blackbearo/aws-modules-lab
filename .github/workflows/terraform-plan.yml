name: terraform-plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

# 同一個 PR 連推 commit 時取消前一次，避免搶 state 鎖
concurrency:
  group: tf-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write        # ← 沒有這行拿不到 OIDC token，assume 會失敗
  contents: read
  pull-requests: write   # ← 為了把 plan 貼回 PR

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::575005867578:role/gh-terraform-plan
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive
        working-directory: .          # ← 根目錄，涵蓋 modules/（見 D-3）

      - name: init
        run: terraform init -input=false
      
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Checkov
        uses: bridgecrewio/checkov-action@b17b606d6ec72bb8ba5721ad5b7e340b80a9fc39 # v12.3142.0
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          output_format: cli

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        continue-on-error: true
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform plan -no-color -input=false -lock-timeout=5m | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 把 plan 貼回 PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync(
              'terraform/environments/dev/plan.txt', 'utf8');
            if (body.length > 60000) {
              body = body.slice(0, 60000) + '\n\n...(輸出過長已截斷，詳見 Actions log)';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Terraform Plan (dev)\n```hcl\n' + body + '\n```'
            });

      - name: plan 失敗就讓整個 job 紅掉
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
